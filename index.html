<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vorrat Scanner">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f0e6">
<title>Vorrat Scanner</title>
<style>
  :root {
    --paper: #f4f0e6;
    --ink: #1b1915;
    --olive: #243c2b;
    --clay: #9a3412;
    --card: #fbf8f1;
    --mist: #cfc6b4;
    --muted: #4a453c;
    --wash: rgba(74, 112, 146, 0.34);
    --sans: -apple-system, BlinkMacSystemFont, ui-sans-serif, system-ui, sans-serif;
    --serif: ui-serif, "New York", palatino, "Palatino Linotype", georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-appearance: none; appearance: none; }
  input, textarea { -webkit-appearance: none; appearance: none; }
  button:disabled { cursor: default; }
  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .app input, .app textarea { -webkit-user-select: text; user-select: text; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  nav.bar { display: flex; flex-shrink: 0; border-top: 1px solid var(--mist); background: var(--card); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.bar button {
    flex: 1; min-height: 56px; border: 0; border-top: 4px solid transparent; background: transparent;
    color: var(--muted); font-size: 12px; font-weight: 650; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0;
  }
  nav.bar button svg { width: 20px; height: 20px; margin-bottom: 2px; pointer-events: none; }
  nav.bar button.on { color: var(--olive); border-top-color: var(--olive); }
  .kicker { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--olive); }
  h2 { margin: 4px 0 0; font-family: var(--serif); font-size: 36px; font-weight: 500; }
  h3 { margin: 0 0 8px; font-size: 18px; color: var(--olive); }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .pad { padding: 16px 20px 12px; }
  .hero { font-family: var(--serif); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; margin: 0; }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 16px; }
  .field input, .textin, textarea.out {
    width: 100%; height: 56px; border: 1px solid var(--mist); border-radius: 16px;
    background: var(--paper); padding: 0 16px; font-size: 18px; outline: none;
  }
  textarea.out { height: 260px; padding: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.35; resize: vertical; }
  .field input:focus, .textin:focus, textarea.out:focus { border-color: var(--olive); box-shadow: 0 0 0 2px var(--olive); }
  .card { border: 1px solid var(--mist); background: var(--card); border-radius: 16px; padding: 16px; margin: 0 16px 12px; }
  .card.warn { border-color: var(--clay); }
  .card.ok { border-color: var(--olive); }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .row > * + * { margin-left: 12px; }
  .stack > * + * { margin-top: 12px; }
  .btn {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    min-height: 56px; width: 100%; border: 0; border-radius: 16px; background: var(--olive);
    color: var(--card); font-size: 18px; font-weight: 650; padding: 0 16px; text-align: center;
  }
  .btn.clay { background: var(--clay); }
  .btn.light { background: var(--paper); color: var(--ink); border: 1px solid var(--mist); }
  .btn.ghost { width: auto; min-height: 44px; background: var(--paper); color: var(--ink); border: 1px solid var(--mist); border-radius: 999px; padding: 0 16px; font-size: 16px; }
  .btn.ghost.danger { color: var(--clay); border-color: var(--clay); }
  .btn.ghost.armed { background: var(--clay); color: var(--card); border-color: var(--clay); }
  .btn:disabled { opacity: 0.4; }
  .btn input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; font-size: 200px; cursor: pointer; }
  .round {
    width: 56px; height: 56px; flex: 0 0 56px; border: 0; border-radius: 999px; background: var(--olive);
    color: var(--card); display: inline-flex; align-items: center; justify-content: center; padding: 0; font-size: 28px; line-height: 1;
  }
  .stepper input { text-align: center; font-family: var(--serif); font-size: 28px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-gap: 12px; gap: 12px; }
  .split .field { margin-bottom: 0; }
  .preview { display: block; width: 100%; max-height: 46vh; object-fit: contain; border-radius: 12px; background: var(--paper); }
  .drop { border: 2px dashed var(--mist); border-radius: 16px; padding: 28px 16px; text-align: center; color: var(--muted); }
  .note { margin: 8px 0 0; font-size: 15px; color: var(--muted); }
  .note.clay { color: var(--clay); }
  .err { color: var(--clay); font-weight: 650; margin: 0 0 12px; }
  .strip {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; width: 100%;
    min-height: 48px; border: 0; border-top: 1px solid var(--mist); background: var(--paper);
    padding: 8px 16px; font-size: 15px; color: var(--ink); text-align: left;
  }
  .strip b { color: var(--olive); }
  ul.list { list-style: none; margin: 0; padding: 0; }
  .entry { cursor: pointer; }
  .entry .name { margin: 0; font-size: 18px; font-weight: 650; }
  .entry .big { font-family: var(--serif); font-size: 24px; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 8px; background: var(--paper); border: 1px solid var(--mist); color: var(--muted); margin: 6px 6px 0 0; }
  .tag.clay { color: var(--clay); border-color: var(--clay); }
  .kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--mist); }
  .kv:last-child { border-bottom: 0; }
  .kv span:last-child { font-variant-numeric: tabular-nums; font-weight: 650; text-align: right; }
  .busy { display: flex; flex-direction: column; align-items: center; padding: 24px 0 8px; }
  .spin { width: 44px; height: 44px; border-radius: 999px; border: 4px solid var(--mist); border-top-color: var(--olive); -webkit-animation: spin 0.9s linear infinite; animation: spin 0.9s linear infinite; }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flash { margin: 0 16px 12px; padding: 12px 16px; border-radius: 16px; background: var(--olive); color: var(--card); font-weight: 650; }
  a { color: var(--olive); }
  @media (prefers-reduced-motion: reduce) { .spin { -webkit-animation-duration: 3s; animation-duration: 3s; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function () {
  "use strict";
  if (window.Element && !Element.prototype.matches) Element.prototype.matches = Element.prototype.webkitMatchesSelector;
  if (window.Element && !Element.prototype.closest) {
    Element.prototype.closest = function (sel) {
      var el = this;
      while (el && el.nodeType === 1) { if (el.matches(sel)) return el; el = el.parentNode; }
      return null;
    };
  }
  function closestFrom(target, sel) {
    var el = target;
    if (el && el.nodeType !== 1) el = el.parentNode;
    return el && el.closest ? el.closest(sel) : null;
  }

  var storage = (function () {
    try {
      var t = "__t";
      window.localStorage.setItem(t, t);
      window.localStorage.removeItem(t);
      return window.localStorage;
    } catch (e) {
      var mem = {};
      return {
        getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
        setItem: function (k, v) { mem[k] = String(v); },
        removeItem: function (k) { delete mem[k]; }
      };
    }
  })();

  var KEY = "vorrat-scanner.v1";
  var SKEY = "vorrat-scanner.settings.v1";
  var API_URL = "https://api.openai.com/v1/chat/completions";
  var DEFAULT_MODEL = "gpt-4o-mini";
  var MAX_SIDE = 1600;
  var TIMEOUT_MS = 90000;

  // ---------- helpers ----------
  function uid() { return "scan-" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      if (c === "&") return "&" + "amp;";
      if (c === "<") return "&" + "lt;";
      if (c === ">") return "&" + "gt;";
      if (c === '"') return "&" + "quot;";
      return "&" + "#39;";
    });
  }
  function num(v) { return typeof v === "number" && isFinite(v); }
  function round(v, d) { var f = Math.pow(10, d || 0); return Math.round(v * f) / f; }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function todayISO(d) { d = d || new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  // German formatting without relying on Intl
  function fmt(value, digits) {
    digits = digits || 0;
    var v = Number(value);
    if (!isFinite(v)) return "–";
    var fixed = Math.abs(v).toFixed(digits);
    var parts = fixed.split(".");
    var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    if (parts[1] && /^0+$/.test(parts[1])) parts[1] = "";
    return (v < 0 && Number(fixed) !== 0 ? "-" : "") + intPart + (parts[1] ? "," + parts[1] : "");
  }
  // Parses "185", "185 g", "1,5", "1.000", "1.234,5". Returns null when empty, NaN when invalid.
  function parseNum(raw) {
    if (typeof raw === "number") return isFinite(raw) ? raw : NaN;
    var t = String(raw == null ? "" : raw).trim().replace(/\s/g, "").replace(/(kcal|kj|g|ml)$/i, "");
    if (!t) return null;
    var n = t;
    if (/^\d{1,3}(\.\d{3})+(,\d*)?$/.test(t)) n = t.replace(/\./g, "").replace(",", ".");
    else if (/^\d+(,\d*)?$/.test(t)) n = t.replace(",", ".");
    else if (!/^\d*(\.\d*)?$/.test(t) || t === ".") return NaN;
    var value = Number(n);
    if (!isFinite(value) || value < 0) return NaN;
    return value;
  }
  function posOrNull(v) {
    if (v == null) return null;
    var n = parseNum(v);
    return num(n) && n > 0 ? n : null;
  }
  function toInput(n) { return num(n) ? String(round(n, 2)).replace(".", ",") : ""; }
  function str(v) { return typeof v === "string" ? v.trim() : ""; }

  // ---------- core logic (also used by the export) ----------
  // item: { name, brand, cans, netWeightPerCan, drainedWeightPerCan, kcalPer100, kcalSource,
  //         servingSizeG, kcalPerServing, servingFromKj, userNote }
  function computeItem(it) {
    var cans = Math.max(1, Math.floor(Number(it.cans) || 1));
    var net = posOrNull(it.netWeightPerCan), drained = posOrNull(it.drainedWeightPerCan);
    var serving = posOrNull(it.servingSizeG), kcalServing = num(it.kcalPerServing) && it.kcalPerServing >= 0 ? it.kcalPerServing : null;
    var kcal100 = num(it.kcalPer100) && it.kcalPer100 >= 0 ? it.kcalPer100 : null;
    var notes = [];
    var rel = null, basis = null;
    if (drained != null) {
      rel = drained; basis = "abtropfgewicht";
      notes.push(net != null ? "Abtropfgewicht verwendet (netto " + fmt(net, 1) + " g, abgetropft " + fmt(drained, 1) + " g je Dose)." : "Nur Abtropfgewicht angegeben, Abtropfgewicht verwendet.");
    } else if (net != null) {
      rel = net; basis = "nettogewicht";
      notes.push("Kein Abtropfgewicht angegeben, Nettogewicht verwendet.");
    }
    var calorieBasis = null, source = it.kcalSource || null;
    if (kcal100 != null) {
      calorieBasis = "per100g";
      if (source === "kj") notes.push("kcal aus kJ umgerechnet (kJ ÷ 4,184).");
    } else if (kcalServing != null) {
      calorieBasis = "perServing";
      if (it.servingFromKj) notes.push("kcal je Portion aus kJ umgerechnet (kJ ÷ 4,184).");
      if (serving != null) {
        kcal100 = round(kcalServing / serving * 100, 1);
        source = "portion";
        notes.push("Kalorien nur je Portion angegeben (" + fmt(kcalServing, 1) + " kcal je " + fmt(serving, 1) + " g), auf 100 g umgerechnet.");
      } else {
        source = null;
        notes.push("Kalorien nur je Portion angegeben, Portionsgröße fehlt: keine kcal je 100 g berechnet.");
      }
    } else {
      source = null;
      notes.push("Keine Kalorienangabe: kcal bleiben leer.");
    }
    if (calorieBasis === "per100g" && serving != null) notes.push("Portion laut Etikett: " + fmt(serving, 1) + " g" + (kcalServing != null ? " = " + fmt(kcalServing, 1) + " kcal." : "."));
    var grams = rel != null ? round(rel * cans, 1) : 0;
    var kcalPerCan = kcal100 != null && rel != null ? Math.round(kcal100 * rel / 100) : null;
    var kcalTotal = kcal100 != null && rel != null ? Math.round(kcal100 * rel * cans / 100) : null;
    return {
      cans: cans, net: net, drained: drained, rel: rel, weightBasis: basis, grams: grams,
      kcalPer100: kcal100 != null ? round(kcal100, 1) : null, kcalSource: source, calorieBasis: calorieBasis,
      servingSizeG: serving, kcalPerServing: kcalServing != null ? round(kcalServing, 1) : null,
      kcalPerCan: kcalPerCan, kcalTotal: kcalTotal, autoNotes: notes
    };
  }
  function buildExport(items, now) {
    now = now || new Date();
    var totals = { cans: 0, grams: 0, kcal: 0, itemsWithoutKcal: 0 };
    var out = items.map(function (it) {
      var c = computeItem(it);
      totals.cans += c.cans; totals.grams += c.grams;
      if (c.kcalTotal != null) totals.kcal += c.kcalTotal; else totals.itemsWithoutKcal += 1;
      var note = c.autoNotes.join(" ");
      if (str(it.userNote)) note += (note ? " " : "") + "Notiz: " + str(it.userNote);
      return {
        id: String(it.id),
        name: String(it.name || ""),
        kcalPer100: c.kcalPer100,
        grams: c.grams,
        cans: c.cans,
        brand: str(it.brand) || null,
        netWeightPerCan: c.net,
        drainedWeightPerCan: c.drained,
        weightBasis: c.weightBasis,
        kcalPerCan: c.kcalPerCan,
        kcalTotal: c.kcalTotal,
        servingSizeG: c.servingSizeG,
        kcalPerServing: c.kcalPerServing,
        calorieBasis: c.calorieBasis,
        kcalSource: c.kcalSource,
        note: note
      };
    });
    totals.grams = round(totals.grams, 1);
    return { format: "vorrat-scanner", version: 1, exportedAt: now.toISOString(), totals: totals, items: out };
  }

  // ---------- persistence ----------
  function loadJSON(key) { try { var r = storage.getItem(key); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function saveJSON(key, v) { try { storage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function cleanItem(it) {
    if (!it || typeof it.id !== "string" || typeof it.name !== "string") return null;
    function n(v) { return num(v) ? v : null; }
    return {
      id: it.id, name: it.name, brand: typeof it.brand === "string" ? it.brand : "",
      cans: Math.max(1, Math.floor(Number(it.cans) || 1)),
      netWeightPerCan: n(it.netWeightPerCan), drainedWeightPerCan: n(it.drainedWeightPerCan),
      kcalPer100: n(it.kcalPer100), kcalSource: typeof it.kcalSource === "string" ? it.kcalSource : null,
      servingSizeG: n(it.servingSizeG), kcalPerServing: n(it.kcalPerServing), servingFromKj: it.servingFromKj === true,
      userNote: typeof it.userNote === "string" ? it.userNote : ""
    };
  }
  var saved = loadJSON(KEY) || {};
  var settings = loadJSON(SKEY) || {};
  var S = {
    screen: "front",
    items: Array.isArray(saved.items) ? saved.items.map(cleanItem).filter(Boolean) : [],
    draft: saved.draft && typeof saved.draft === "object" ? saved.draft : null,
    editingId: typeof saved.editingId === "string" ? saved.editingId : null,
    photo: { front: null, back: null },     // downscaled JPEG data URLs (memory only)
    busy: null, err: null, flash: null, delArm: null, clearArm: false, showKey: false, exportStatus: null, settingsMsg: null
  };
  if (!settings.model) settings.model = DEFAULT_MODEL;
  if (S.draft && S.draft.stage === "confirm") S.screen = "confirm";
  if (!settings.apiKey && !S.items.length && !S.draft) S.screen = "settings";
  var controller = null;
  function persist() { saveJSON(KEY, { items: S.items, draft: S.draft, editingId: S.editingId }); }

  function newDraft() {
    return { stage: "front", name: "", brand: "", cans: "1", net: "", drained: "", kcal100: "", kcalSource: null,
      serving: "", kcalServing: "", servingFromKj: false, note: "", front: null, back: null };
  }
  function draftToItem(d) {
    return {
      name: str(d.name), brand: str(d.brand), cans: Math.floor(Number(parseNum(d.cans)) || 1),
      netWeightPerCan: posOrNull(d.net), drainedWeightPerCan: posOrNull(d.drained),
      kcalPer100: num(parseNum(d.kcal100)) ? parseNum(d.kcal100) : null, kcalSource: d.kcalSource,
      servingSizeG: posOrNull(d.serving), kcalPerServing: num(parseNum(d.kcalServing)) ? parseNum(d.kcalServing) : null,
      servingFromKj: d.servingFromKj === true, userNote: str(d.note)
    };
  }
  function itemToDraft(it) {
    var d = newDraft();
    d.stage = "confirm"; d.name = it.name; d.brand = it.brand || ""; d.cans = String(it.cans);
    d.net = toInput(it.netWeightPerCan); d.drained = toInput(it.drainedWeightPerCan);
    d.kcal100 = toInput(it.kcalPer100); d.kcalSource = it.kcalSource;
    d.serving = toInput(it.servingSizeG); d.kcalServing = toInput(it.kcalPerServing);
    d.servingFromKj = it.servingFromKj === true; d.note = it.userNote || "";
    return d;
  }

  // ---------- image handling ----------
  function downscale(file) {
    return new Promise(function (resolve, reject) {
      var URLs = window.URL || window.webkitURL;
      var url = URLs.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          if (!w || !h) throw new Error("empty");
          var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          var data = canvas.toDataURL("image/jpeg", 0.8);
          URLs.revokeObjectURL(url);
          if (!data || data.length < 100 || data.indexOf("data:image/jpeg") !== 0) throw new Error("canvas");
          resolve(data);
        } catch (e) { URLs.revokeObjectURL(url); reject(new Error("Das Foto konnte nicht verarbeitet werden. Bitte ein anderes Foto versuchen.")); }
      };
      img.onerror = function () { URLs.revokeObjectURL(url); reject(new Error("Dieses Bildformat kann der Browser nicht öffnen. Bitte ein JPEG oder ein Foto direkt aus der Kamera nehmen.")); };
      img.src = url;
    });
  }

  // ---------- OpenAI vision ----------
  var PROMPT_FRONT = [
    "Du liest Fotos von Lebensmittel-Konserven und Verpackungen. Das Foto zeigt die VORDERSEITE von einer oder mehreren identischen Dosen/Packungen.",
    "Antworte NUR mit einem JSON-Objekt mit genau diesen Schlüsseln:",
    '{"productName": string|null, "brand": string|null, "canCount": integer|null, "confidence": "hoch"|"mittel"|"niedrig", "notes": string|null}',
    "- productName: Produktname wie aufgedruckt, mit Sorte (z. B. \"Thunfisch in Sonnenblumenöl\"), ohne Marke. In der Sprache des Etiketts.",
    "- brand: Marke, falls klar lesbar.",
    "- canCount: Anzahl der sichtbaren identischen Dosen/Packungen dieses Produkts. Sorgfältig zählen, auch teilweise verdeckte, wenn eindeutig erkennbar. Null, wenn nicht zählbar.",
    "- notes: kurze Hinweise auf Deutsch (z. B. unterschiedliche Produkte im Bild, unscharf), sonst null.",
    "Regeln: Gib null zurück für alles, was nicht klar lesbar ist. Niemals raten oder erfinden."
  ].join("\n");
  var PROMPT_BACK = [
    "Du liest Fotos von Lebensmittel-Konserven und Verpackungen. Das Foto zeigt die RÜCKSEITE/das Etikett mit Gewicht und Nährwerttabelle.",
    "Antworte NUR mit einem JSON-Objekt mit genau diesen Schlüsseln (Zahlen als JSON-Zahlen, Gewichte in Gramm):",
    '{"netWeightG": number|null, "drainedWeightG": number|null, "kcalPer100g": number|null, "kjPer100g": number|null, "kcalPerServing": number|null, "kjPerServing": number|null, "servingSizeG": number|null, "confidence": "hoch"|"mittel"|"niedrig", "notes": string|null}',
    "- netWeightG: Gesamtgewicht je Dose: \"Nettofüllmenge\", \"Füllmenge\", \"Nettogewicht\", \"Inhalt\", \"Net weight\", \"Poids net\", \"e\"-Angabe. kg in g umrechnen (0,4 kg = 400).",
    "- drainedWeightG: \"Abtropfgewicht\", \"Abtropfmasse\", \"Drained weight\", \"Poids net égoutté\". Nur wenn angegeben.",

    if (!S.items.length) return '<div class="scroll">' + h + '<div class="card"><p style="margin:0">Die Liste ist leer. Erfasse zuerst Dosen.</p><div style="height:12px"></div><button type="button" class="btn" data-act="new">Neue Dosen erfassen</button></div></div>';
    var t = totalsOf(S.items);
    var body = '<div class="card"><p style="margin:0 0 12px">' + fmt(t.entries) + (t.entries === 1 ? " Eintrag" : " Einträge") + " · " + fmt(t.cans) + " Dosen · " + fmt(t.kcal) + " kcal</p>" +
      '<textarea class="out" id="json-out" readonly spellcheck="false">' + esc(exportText()) + "</textarea></div>";
    body += '<div style="padding:0 16px 12px" class="stack"><button type="button" class="btn" data-act="download">Speichern / Download</button>' +
      (canShareFile() ? '<button type="button" class="btn light" data-act="share">Teilen …</button>' : "") +
      '<button type="button" class="btn light" data-act="copy">Kopieren</button>' +
      (S.exportStatus ? '<p class="note" id="exp-status">' + esc(S.exportStatus) + "</p>" : "") +
      '<p class="note">Dateiname: ' + esc(fileName()) + "</p></div>";
    return '<div class="scroll">' + h + body + "</div>";
  }
  function maskKey(k) { return k ? k.slice(0, 3) + "…" + k.slice(-4) : ""; }
  function settingsScreen() {
    var h = header("Einrichtung", "Einstellungen", "Für das Auslesen braucht die App einen eigenen OpenAI-API-Schlüssel.");
    var body = '<div class="card"><label class="field"><span>OpenAI-API-Schlüssel' + (settings.apiKey ? " · gespeichert: " + esc(maskKey(settings.apiKey)) : "") + '</span>' +
      '<input id="s-key" type="' + (S.showKey ? "text" : "password") + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="sk-…" value="' + esc(settings.apiKey || "") + '"></label>' +
      '<button type="button" class="btn ghost" data-act="togglekey">' + (S.showKey ? "Verbergen" : "Anzeigen") + "</button>" +
      '<div style="height:12px"></div><label class="field"><span>Modell</span><input id="s-model" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="' + esc(settings.model || DEFAULT_MODEL) + '"></label>' +
      '<p class="note">Standard: gpt-4o-mini (günstig). Für schwer lesbare Etiketten: gpt-4o.</p></div>';
    if (S.settingsMsg) body += '<div class="card ' + (S.settingsMsg.ok ? "ok" : "warn") + '"><p style="margin:0">' + esc(S.settingsMsg.text) + "</p></div>";
    if (S.busy === "test") body += '<div class="card"><div class="busy"><div class="spin"></div><p class="muted" style="margin:12px 0 0">Wird geprüft …</p></div></div>';
    body += '<div style="padding:0 16px 12px" class="stack"><button type="button" class="btn" data-act="savekey">Speichern</button>' +
      '<button type="button" class="btn light" data-act="testkey"' + (S.busy ? " disabled" : "") + '>Speichern und testen</button>' +
      (settings.apiKey ? '<button type="button" class="btn ghost danger" style="width:100%" data-act="delkey">Schlüssel löschen</button>' : "") + "</div>";
    body += '<div class="card"><p style="margin:0" class="small">Der Schlüssel wird nur auf diesem Gerät gespeichert (im Browser-Speicher dieser Seite) und nur direkt an api.openai.com gesendet. Jedes Auslesen kostet ein paar Zehntel Cent. Schlüssel erstellen: <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a></p></div>';
    return '<div class="scroll">' + h + body + "</div>";
  }
  function render() {
    var html;
    if (S.screen === "front" || S.screen === "back") { if (!S.draft) S.draft = newDraft(); html = scanScreen(S.screen); }
    else if (S.screen === "confirm") { if (!S.draft) { S.screen = "front"; return render(); } html = confirmScreen(); }
    else if (S.screen === "list") html = listScreen();
    else if (S.screen === "json") html = jsonScreen();
    else html = settingsScreen();
    app.innerHTML = '<div style="flex:1;min-height:0;display:flex;flex-direction:column">' + html + "</div>" + nav();
  }
  function go(screen) {
    S.screen = screen; S.err = null; S.delArm = null; S.clearArm = false; S.exportStatus = null; S.settingsMsg = null;
    render();
    var sc = app.querySelector(".scroll"); if (sc) sc.scrollTop = 0;
  }
  var flashTimer = null;
  function flash(msg) {
    S.flash = msg; clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { S.flash = null; if (S.screen !== "confirm") render(); }, 2500);
  }

  // ---------- confirm screen: live updates without re-render ----------
  var FIELD_MAP = { "f-name": "name", "f-brand": "brand", "f-cans": "cans", "f-net": "net", "f-drained": "drained", "f-kcal100": "kcal100", "f-serving": "serving", "f-kcalserving": "kcalServing", "f-note": "note" };
  function onField(el) {
    var key = FIELD_MAP[el.getAttribute("data-f")];
    if (!key || !S.draft) return;
    S.draft[key] = el.value;
    if (key === "kcal100") S.draft.kcalSource = str(el.value) ? "manuell" : null;
    if (key === "kcalServing") S.draft.servingFromKj = false;
    var p = document.getElementById("f-preview"); if (p) p.innerHTML = previewHTML(S.draft);
    var e = document.getElementById("f-err"); if (e) e.style.display = "none";
    persist();
  }
  function validate(d) {
    if (!str(d.name)) return "Bitte einen Namen eingeben.";
    var cans = parseNum(d.cans);
    if (!num(cans) || cans < 1 || Math.floor(cans) !== cans) return "Anzahl Dosen: bitte eine ganze Zahl ab 1.";
    var checks = [["net", "Nettogewicht"], ["drained", "Abtropfgewicht"], ["kcal100", "kcal je 100 g"], ["serving", "Portion"], ["kcalServing", "kcal je Portion"]];
    for (var i = 0; i < checks.length; i++) { var v = parseNum(d[checks[i][0]]); if (v !== null && !num(v)) return checks[i][1] + ": bitte eine Zahl eingeben."; }
    if (posOrNull(d.net) == null && posOrNull(d.drained) == null) return "Bitte mindestens ein Gewicht je Dose eingeben (netto oder abgetropft).";
    var n = posOrNull(d.net), dr = posOrNull(d.drained);
    if (n != null && dr != null && dr > n) return "Das Abtropfgewicht ist größer als das Nettogewicht. Bitte prüfen.";
    var k = parseNum(d.kcal100); if (num(k) && k > 900) return "Mehr als 900 kcal je 100 g ist nicht möglich. Bitte prüfen (kJ statt kcal?).";
    return null;
  }

  // ---------- export actions ----------
  function fileName() { return "vorrat-" + todayISO() + ".json"; }
  function setStatus(msg) { S.exportStatus = msg; render(); }
  function download() {
    var text = exportText();
    try {
      var blob = new Blob([text], { type: "application/json" });
      var URLs = window.URL || window.webkitURL;
      var url = URLs.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = fileName(); a.rel = "noopener"; a.style.display = "none";
      document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URLs.revokeObjectURL(url); }, 30000);
      setStatus("Download gestartet. Auf dem iPhone landet die Datei unter Dateien › Downloads. Klappt es nicht, „Teilen“ oder „Kopieren“ nutzen.");
    } catch (e) { setStatus("Download nicht möglich. Bitte „Teilen“ oder „Kopieren“ nutzen."); }
  }
  function share() {
    try {
      var file = new File([exportText()], fileName(), { type: "application/json" });
      navigator.share({ files: [file], title: fileName() }).then(function () { setStatus("Geteilt."); }, function (e) { if (!e || e.name !== "AbortError") setStatus("Teilen hat nicht geklappt. Bitte „Kopieren“ nutzen."); });
    } catch (e) { setStatus("Teilen ist hier nicht möglich."); }
  }
  function copy() {
    var text = exportText();
    function fallback() {
      var ta = document.getElementById("json-out");
      if (!ta) return setStatus("Kopieren nicht möglich.");
      ta.removeAttribute("readonly"); ta.focus(); ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (e) {}
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      ta.setAttribute("readonly", ""); ta.blur();
      setStatus(ok ? "In die Zwischenablage kopiert." : "Bitte den Text im Feld markieren und kopieren.");
    }
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { setStatus("In die Zwischenablage kopiert."); }, fallback);
    } else fallback();
  }

  // ---------- events ----------
  function readPhoto(kind) {
    var img = S.photo[kind];
    if (!img) return;
    if (!settings.apiKey) { S.err = "Kein API-Schlüssel hinterlegt. Bitte in den Einstellungen eintragen."; render(); return; }
    S.busy = kind; S.err = null; render();
    callVision(kind, img).then(function (raw) {
      S.busy = null; controller = null;
      if (kind === "front") {
        var f = sanitizeFront(raw);
        applyFront(S.draft, f);
        S.draft.stage = "back"; persist();
        if (!f.productName && !f.brand) flash("Kein Name lesbar. Du kannst ihn gleich von Hand eintragen.");
        go("back");
      } else {
        var b = sanitizeBack(raw);
        applyBack(S.draft, b);
        S.draft.stage = "confirm"; persist();
        if (b.netWeightG == null && b.drainedWeightG == null && b.kcalPer100g == null && b.kjPer100g == null) flash("Auf dem Etikett war nichts sicher lesbar. Bitte von Hand ergänzen.");
        go("confirm");
      }
    }, function (e) {
      S.busy = null; controller = null;
      S.err = e && e.aborted ? null : (e && e.message) || "Unbekannter Fehler.";
      render();
    });
  }
  function testKey() {
    S.busy = "test"; S.settingsMsg = null; render();
    fetchWithTimeout("https://api.openai.com/v1/models/" + encodeURIComponent(settings.model), { headers: { "Authorization": "Bearer " + settings.apiKey } }).then(function (res) {
      return res.text().then(function (txt) {
        var data = null; try { data = JSON.parse(txt); } catch (e) {}
        S.busy = null;
        S.settingsMsg = res.ok ? { ok: true, text: "Schlüssel funktioniert, Modell „" + settings.model + "“ ist verfügbar." } : { ok: false, text: apiErrorMessage(res.status, data) };
        render();
      });
    }, function (e) { S.busy = null; S.settingsMsg = { ok: false, text: e.message }; render(); });
  }
  function saveSettingsFromForm() {
    var k = document.getElementById("s-key"), m = document.getElementById("s-model");
    if (k) settings.apiKey = k.value.replace(/\s+/g, "");
    if (m) settings.model = str(m.value) || DEFAULT_MODEL;
    saveJSON(SKEY, settings);
  }

  app.addEventListener("change", function (event) {
    var el = event.target;
    var kind = el && el.getAttribute ? el.getAttribute("data-photo") : null;
    if (!kind || !el.files || !el.files[0]) return;
    var file = el.files[0];
    S.busy = "prep-" + kind; S.err = null; render();
    downscale(file).then(function (data) { S.photo[kind] = data; S.busy = null; render(); }, function (e) { S.busy = null; S.err = e.message; render(); });
  });
  app.addEventListener("input", function (event) {
    var el = event.target;
    if (el && el.getAttribute && el.getAttribute("data-f")) onField(el);
  });
  app.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && event.target && event.target.tagName === "INPUT") { event.preventDefault(); event.target.blur(); }
  });
  app.addEventListener("click", function (event) {
    var t = closestFrom(event.target, "[data-act]");
    if (!t || t.disabled) return;
    var act = t.getAttribute("data-act");
    if (act === "tab") {
      var tab = t.getAttribute("data-tab");
      if (S.screen === "settings" && tab !== "settings") saveSettingsFromForm();
      if (tab === "scan") go(S.draft ? (S.draft.stage === "confirm" ? "confirm" : S.draft.stage === "back" ? "back" : "front") : "front");
      else go(tab);
    } else if (act === "read") readPhoto(t.getAttribute("data-kind"));
    else if (act === "cancel") { if (controller) controller.abort(); S.busy = null; render(); }
    else if (act === "skip") {
      var k = t.getAttribute("data-kind");
      S.draft.stage = k === "front" ? "back" : "confirm"; persist(); go(S.draft.stage);
    } else if (act === "manual") { S.draft.stage = "confirm"; persist(); go("confirm"); }
    else if (act === "back-to-front") { S.draft.stage = "front"; persist(); go("front"); }
    else if (act === "cans") {
      var inp = document.getElementById("f-cans");
      var cur = Math.floor(Number(parseNum(inp ? inp.value : S.draft.cans)) || 1);
      cur = Math.max(1, Math.min(9999, cur + Number(t.getAttribute("data-delta"))));
      if (inp) { inp.value = String(cur); onField(inp); }
    } else if (act === "save-item") {
      var msg = validate(S.draft);
      if (msg) { var e = document.getElementById("f-err"); if (e) { e.textContent = msg; e.style.display = "block"; e.scrollIntoView && e.scrollIntoView(false); } return; }
      var it = draftToItem(S.draft);
      if (S.editingId) {
        it.id = S.editingId;
        S.items = S.items.map(function (x) { return x.id === it.id ? it : x; });
        flash("Gespeichert.");
      } else { it.id = uid(); S.items.push(it); flash("Hinzugefügt: " + it.cans + " × " + it.name); }
      S.draft = null; S.editingId = null; S.photo = { front: null, back: null }; persist(); go("list");
    } else if (act === "discard") {
      S.draft = null; var wasEdit = !!S.editingId; S.editingId = null; S.photo = { front: null, back: null }; persist(); go(wasEdit ? "list" : "front");
    } else if (act === "new") {
      S.draft = newDraft(); S.editingId = null; S.photo = { front: null, back: null }; persist(); go("front");
    } else if (act === "edit") {
      var id = t.getAttribute("data-id");
      var found = null; S.items.forEach(function (x) { if (x.id === id) found = x; });
      if (!found) return;
      S.draft = itemToDraft(found); S.editingId = id; persist(); go("confirm");
    } else if (act === "del") {
      event.stopPropagation();
      var did = t.getAttribute("data-id");
      if (S.delArm === did) { S.items = S.items.filter(function (x) { return x.id !== did; }); S.delArm = null; persist(); flash("Gelöscht."); render(); }
      else { S.delArm = did; render(); setTimeout(function () { if (S.delArm === did) { S.delArm = null; render(); } }, 4000); }
    } else if (act === "clear") {
      if (S.clearArm) { S.items = []; S.clearArm = false; persist(); render(); }
      else { S.clearArm = true; render(); setTimeout(function () { if (S.clearArm) { S.clearArm = false; render(); } }, 4000); }
    } else if (act === "download") download();
    else if (act === "share") share();
    else if (act === "copy") copy();
    else if (act === "togglekey") { saveSettingsFromForm(); S.showKey = !S.showKey; render(); }
    else if (act === "savekey") { saveSettingsFromForm(); S.settingsMsg = { ok: true, text: settings.apiKey ? "Gespeichert." : "Gespeichert (ohne Schlüssel)." }; render(); }
    else if (act === "testkey") { saveSettingsFromForm(); if (!settings.apiKey) { S.settingsMsg = { ok: false, text: "Bitte zuerst einen Schlüssel eintragen." }; render(); } else testKey(); }
    else if (act === "delkey") { settings.apiKey = ""; saveJSON(SKEY, settings); S.settingsMsg = { ok: true, text: "Schlüssel gelöscht." }; render(); }
  });

  // exposed for testing / a future importer
  window.VorratScanner = { setPhoto: function (kind, data) { S.photo[kind] = data; render(); }, computeItem: computeItem, buildExport: buildExport, parseNum: parseNum, sanitizeBack: sanitizeBack, sanitizeFront: sanitizeFront, applyBack: applyBack, newDraft: newDraft, draftToItem: draftToItem, validate: validate };
  render();
})();
</script>
</body>
</html>
